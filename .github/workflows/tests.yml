name: Tests
on: [push, pull_request]
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements-lock.txt
      - run: python -m pytest tests/test_pipeline.py -q
# Real-data and Streamlit integration checks run locally after data preparation.
# CI deliberately does not redistribute or rely on downloading the source dataset.
